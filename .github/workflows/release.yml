name: Release

on:
  issue_comment:
    types: created

jobs:
  release:
    name: Trigger release
    runs-on: ubuntu-latest
    if: github.event.comment.body == 'Trigger release' && github.actor == 'Nitorac'
    env: 
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out plugin repository master branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master

      - name: Set env
        run: |
          RELEASE_VERSION=$(cat addon.xml | grep "<addon"|sed "s/.* version=\"\(.*\)~.*/\1/")
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          echo "* Next release version: $RELEASE_VERSION"
       
      - name: Create plugin zip files for Kodi
        id: prepare_zip
        working-directory: master
        run: |
          mkdir script.service.ignoreforcedsubtitles
          cp -r resources addon.xml changelog.txt filter.py service.py script.service.ignoreforcedsubtitles
          zip -r script.service.ignoreforcedsubtitles.zip script.service.ignoreforcedsubtitles
          echo "zip_filepath=$(realpath script.service.ignoreforcedsubtitles.zip)" | tee -a "${GITHUB_OUTPUT}"

      - name: Prepare GitHub release
        id: prepare_release
        run: |
          echo "tag_name=$(echo v$RELEASE_VERSION)" | tee -a "${GITHUB_OUTPUT}"
          echo "release_name=$(echo v$RELEASE_VERSION)" | tee -a "${GITHUB_OUTPUT}"
       
      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        with:
          tag_name: ${{ steps.prepare_release.outputs.tag_name }}
          release_name: ${{ steps.prepare_release.outputs.release_name }}
          body: ''
          draft: false
          prerelease: false
       
      - name: Upload release zip file
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} 
          asset_path: ${{ steps.prepare_zip.outputs.zip_filepath }}
          asset_name: script.service.ignoreforcedsubtitles.zip
          asset_content_type: application/zip